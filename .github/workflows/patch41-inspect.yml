name: PATCH41 inspect runtime code
on:
  push:
    branches: [build/patch41-sword-gate-footwork-cost]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump relevant code for safe patching
        run: |
          unzip -q SwordMastery_PATCH_40_PASSIVE_TOGGLES_PERCENT_ENERGY_SOURCE.zip -d src
          echo '=== CSHARP FILES ==='
          find src/SwordMastery -name '*.cs' | sort
          echo '=== SEARCH-RELATED SYMBOLS ==='
          grep -RniE 'MaxStamina|Stamina|SwordWave|Footwork|Sewer|Respec|ResetCost|Reset|Statue|CurrentTool|MeleeWeapon|SwordsmanshipApex|Pinnacle|Passive|Energy' src/SwordMastery --include='*.cs' | head -650 || true
