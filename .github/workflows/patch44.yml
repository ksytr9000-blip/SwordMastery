name: SwordMastery 0.1.8 release candidate
on:
  push:
    branches: [release/0.1.8-patch44-fix04]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/release-0.1.8/**'
      - '.github/workflows/patch44.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate directly editable cumulative source
        run: |
          set -euo pipefail
          test -f src/SwordMastery/ModEntry.cs
          test -f src/SwordMastery/SwordMastery.csproj
          grep -q 'fieldId: "DebugApplyChangesExplicitly"' src/SwordMastery/ModEntry.cs
          ! grep -q 'setValue: value => ApplyDebugSwordLevel(value)' src/SwordMastery/ModEntry.cs
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['default','ko','ja','zh']:
              data=json.loads((Path('src/SwordMastery/i18n')/(name+'.json')).read_text(encoding='utf-8-sig'))
              assert 'gmcm.debug.apply.name' in data, name
          print('GMCM progress protection and i18n checks passed.')
          PY
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
          force_build_with_dotnet_version: true
      - name: Regression checks for explicit debug changes
        run: |
          python3 tests/check_gmcm_contract.py
          python3 tests/check_sword_contract.py
          python3 tests/generate_native_hook_test.py
          dotnet run --project tests/DebugProgressionTests.csproj -c Release
      - name: Restore and compile
        working-directory: src/SwordMastery
        run: |
          dotnet restore SwordMastery.csproj
          dotnet build SwordMastery.csproj -c Release --no-restore
      - name: Package cumulative installer and editable source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/SwordMastery
          cp src/SwordMastery/bin/Release/net6.0/SwordMastery.dll package/SwordMastery/
          cp src/SwordMastery/manifest.json package/SwordMastery/
          cp -r src/SwordMastery/i18n src/SwordMastery/assets package/SwordMastery/
          cp src/SwordMastery/README_USER.txt package/SwordMastery/ || true
          cp docs/release-0.1.8/VALIDATION_STATUS.txt package/SwordMastery/
          cp docs/release-0.1.8/NEXUS_CHANGELOG_KO.txt docs/release-0.1.8/NEXUS_CHANGELOG_EN.txt package/SwordMastery/
          (cd package && zip -qr ../SwordMastery_0.1.8_INSTALL.zip SwordMastery)
          unzip -t SwordMastery_0.1.8_INSTALL.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, json
          target = Path('SwordMastery_0.1.8_SOURCE.zip')
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as z:
              for base in ['src/SwordMastery', 'tests', 'docs/release-0.1.8']:
                  for p in sorted(Path(base).rglob('*')):
                      if not p.is_file() or any(part in {'bin','obj','__pycache__','data'} for part in p.parts):
                          continue
                      if p.suffix.lower() in {'.dll','.pdb','.pyc'} or p.name in {'config.json','__folder_managed_by_vortex'} or p.name.endswith('.g.cs'):
                          continue
                      z.write(p, 'SwordMastery-0.1.8/' + p.as_posix())
              z.write('.github/workflows/patch44.yml','SwordMastery-0.1.8/.github/workflows/patch44.yml')
              z.write('docs/release-0.1.8/SOURCE_BUILD.txt','SwordMastery-0.1.8/README_BUILD.txt')
          with zipfile.ZipFile('SwordMastery_0.1.8_INSTALL.zip') as z:
              assert z.testzip() is None
              assert json.loads(z.read('SwordMastery/manifest.json'))['Version'] == '0.1.8'
              assert not any(n.endswith(('.cs','.csproj','config.json')) or '/data/' in n for n in z.namelist())
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              assert 'SwordMastery-0.1.8/tests/DebugProgressionTests.csproj' in z.namelist()
          paths = [Path('SwordMastery_0.1.8_INSTALL.zip'), target]
          Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in paths))
          print('Installer/source contents, manifest version and checksums validated.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          compression-level: 0
          name: SwordMastery_0.1.8_INSTALL
          path: SwordMastery_0.1.8_INSTALL.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          compression-level: 0
          name: SwordMastery_0.1.8_SOURCE
          path: SwordMastery_0.1.8_SOURCE.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: SwordMastery_0.1.8_RELEASE_NOTES
          path: |
            docs/release-0.1.8/
            SHA256SUMS.txt
          if-no-files-found: error
