name: SwordMastery Tower integration development build
on:
  push:
    branches: [release/0.1.8-patch44-fix04, feat/trial-tower-consumer]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/TOWER_INTEGRATION_KO.md'
      - 'docs/release-0.1.8/**'
      - '.github/workflows/patch44.yml'
  pull_request:
    branches: [release/0.1.8-patch44-fix04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Legacy Harmony/MonoMod helpers require the pre-glibc-2.41 loader behavior.
    # Pin the supported runner instead of changing or skipping native hook tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate directly editable cumulative source
        run: |
          set -euo pipefail
          test -f src/SwordMastery/ModEntry.cs
          test -f src/SwordMastery/SwordMastery.csproj
          grep -q 'fieldId: "DebugApplyChangesExplicitly"' src/SwordMastery/ModEntry.cs
          ! grep -q 'setValue: value => ApplyDebugSwordLevel(value)' src/SwordMastery/ModEntry.cs
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['default','ko','ja','zh']:
              data=json.loads((Path('src/SwordMastery/i18n')/(name+'.json')).read_text(encoding='utf-8-sig'))
              assert 'gmcm.debug.apply.name' in data, name
          print('GMCM progress protection and i18n checks passed.')
          PY
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
          force_build_with_dotnet_version: true
      - name: Regression checks for explicit debug changes
        run: |
          python3 tests/check_gmcm_contract.py
          python3 tests/check_sword_contract.py
          python3 tests/generate_native_hook_test.py
          dotnet run --project tests/DebugProgressionTests.csproj -c Release -p:HarmonyTestVersion=2.3.3
          dotnet run --project tests/DebugProgressionTests.csproj -c Release -p:HarmonyTestVersion=2.4.2
          dotnet run --project tests/TowerContracts -c Release
      - name: Restore and compile
        working-directory: src/SwordMastery
        run: |
          dotnet restore SwordMastery.csproj
          dotnet build SwordMastery.csproj -c Release --no-restore
      - name: Package verified development installer
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          retention-days: 1
          compression-level: 0
          name: SwordMastery-Tower-Development
          path: |
            artifacts/SwordMastery-*-Development.zip
            artifacts/SwordMastery-*-Development.zip.sha256
            docs/TOWER_INTEGRATION_KO.md
          if-no-files-found: error
