  ARCHIVE_SHARD: 'preservation only'
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const repo=context.repo, release_id=424244911;
            const plan=JSON.parse(process.env.REVIEWED_PLAN);
            const entries=plan.artifacts;
            const hash=b=>'sha256:'+crypto.createHash('sha256').update(b).digest('hex');
            const bytes=d=>{if(Buffer.isBuffer(d))return d;if(d instanceof ArrayBuffer)return Buffer.from(d);throw new Error('Expected binary data');};
            const release=(await github.rest.repos.getRelease({...repo,release_id})).data;
            if(!release.draft || release.tag_name!=='actions-storage-archive-20261026')throw new Error('Archive draft identity changed');
            const assets=await github.paginate(github.rest.repos.listReleaseAssets,{...repo,release_id,per_page:100});
            const verified=[];
            for(const e of entries){
              const name='artifact-'+e.id+'.zip';
              let asset=assets.find(a=>a.name===name);
              if(!asset){
                const a=(await github.rest.actions.getArtifact({...repo,artifact_id:e.id})).data;
                if(a.expired||a.digest!==e.digest||a.name!==e.name||a.size_in_bytes!==e.size||a.workflow_run.id!==e.run_id||a.workflow_run.head_sha!==e.head_sha)throw new Error('Artifact changed: '+e.id);
                const data=bytes((await github.rest.actions.downloadArtifact({...repo,artifact_id:e.id,archive_format:'zip'})).data);
                if(data.length!==e.size||hash(data)!==e.digest)throw new Error('Source checksum mismatch: '+e.id);
                asset=(await github.rest.repos.uploadReleaseAsset({...repo,release_id,name,label:e.name+' | '+e.digest,data,headers:{'content-type':'application/zip','content-length':data.length}})).data;
              }
              if(asset.state!=='uploaded'||asset.size!==e.size||asset.digest!==e.digest)throw new Error('Backup metadata mismatch: '+e.id);
              const data=bytes((await github.rest.repos.getReleaseAsset({...repo,asset_id:asset.id,headers:{accept:'application/octet-stream'}})).data);
              if(data.length!==e.size||hash(data)!==e.digest)throw new Error('Downloaded backup checksum mismatch: '+e.id);
              const record={...e,release_id,asset_id:asset.id,asset_name:name,verified_sha256:hash(data)};
              verified.push(record);
              console.log('STORAGE_BACKUP '+JSON.stringify(record));
            }
            core.setOutput('verified',JSON.stringify(verified));
            await core.summary.addHeading('Backup only: shard '+process.env.ARCHIVE_SHARD).addRaw(verified.length+' immutable Release assets downloaded and SHA-256 verified. This job has no Actions delete permission.').write();
