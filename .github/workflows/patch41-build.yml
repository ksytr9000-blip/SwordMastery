name: SwordMastery PATCH41 Sword Only Statue Respec Footwork Cost
on:
  push:
    branches: [build/patch41-sword-gate-footwork-cost]
    paths:
      - 'src/**'
      - '.github/workflows/patch41-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
          force_build_with_dotnet_version: true
      - name: Restore
        run: dotnet restore src/SwordMastery/SwordMastery.csproj
      - name: Compile
        run: dotnet build src/SwordMastery/SwordMastery.csproj -c Release --no-restore
      - name: Package cumulative install and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/SwordMastery
          cp src/SwordMastery/bin/Release/net6.0/SwordMastery.dll out/SwordMastery/
          cp src/SwordMastery/manifest.json out/SwordMastery/
          cp -r src/SwordMastery/assets out/SwordMastery/
          cp -r src/SwordMastery/i18n out/SwordMastery/
          cp src/SwordMastery/README_USER.txt src/SwordMastery/README_PATCH_41.txt out/SwordMastery/
          (cd out && zip -qr ../SwordMastery_PATCH41_CUMULATIVE_INSTALL.zip SwordMastery)
          unzip -t SwordMastery_PATCH41_CUMULATIVE_INSTALL.zip
          (cd src && zip -qr ../SwordMastery_PATCH41_CUMULATIVE_SOURCE.zip SwordMastery -x 'SwordMastery/bin/*' 'SwordMastery/obj/*')
      - uses: actions/upload-artifact@v4
        with:
          name: SwordMastery-PATCH41-CUMULATIVE-INSTALL
          path: SwordMastery_PATCH41_CUMULATIVE_INSTALL.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SwordMastery-PATCH41-CUMULATIVE-SOURCE
          path: SwordMastery_PATCH41_CUMULATIVE_SOURCE.zip
          if-no-files-found: error
