name: Build SwordMastery PATCH37 FIX01

on:
  push:
    branches:
      - build/patch37-fix01-cjk-compiled
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch code
        uses: actions/checkout@v4

      - name: Extract PATCH36 full source and apply PATCH37 FIX01
        shell: bash
        run: |
          set -euo pipefail
          mkdir buildsrc
          unzip -q SwordMastery_PATCH_36_SCOPED_CJK_GMCM_SOURCE.zip -d buildsrc
          cd buildsrc/SwordMastery
          python3 - <<'PY'
          from pathlib import Path
          file = Path("CjkTextService.cs")
          content = file.read_text(encoding="utf-8")
          old = """if (c is >= '\\u2E80' and <= '\\u9FFF' or >= '\\uAC00' and <= '\\uD7AF'
                          or >= '\\uF900' and <= '\\uFAFF' or >= '\\uFF66' and <= '\\uFF9D')"""
          new = """if (c is >= '\\u2E80' and <= '\\u9FFF'
                          or >= '\\uAC00' and <= '\\uD7AF'
                          or >= '\\uF900' and <= '\\uFAFF'
                          or >= '\\uFF01' and <= '\\uFFEF')"""
          assert content.count(old) == 1, "PATCH37 CJK match not found exactly once"
          file.write_text(content.replace(old, new), encoding="utf-8")
          file = Path("I18n.cs")
          content = file.read_text(encoding="utf-8")
          old = """return OwnedText.TryGetValue(text, out _) || AllModCjkText.Contains(text);"""
          new = """return OwnedText.TryGetValue(text, out _) || AllModCjkText.Contains(text)
                          || IsWrappedOwnedText(text);"""
          assert content.count(old) == 1, "PATCH37 GMCM match not found exactly once"
          content = content.replace(old, new)
          marker = """    private static string TrackModText(string text)"""
          extra = """    // Only recognize copied/wrapped mod labels within this mod's own GMCM page.
              private static bool IsWrappedOwnedText(string text)
              {
                  if (text.Length < 2 || text.IndexOf('\\n') < 0)
                      return false;
                  string normalized = text.Replace("\\r", "", StringComparison.Ordinal)
                      .Replace("\\n", "", StringComparison.Ordinal);
                  return AllModCjkText.Contains(normalized);
              }

          """
          assert content.count(marker) == 1, "PATCH37 marker not found exactly once"
          file.write_text(content.replace(marker, extra + marker), encoding="utf-8")
          print("PATCH37 code corrections successfully applied.")
          PY

      - name: Add Stardew SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
          force_build_with_dotnet_version: true

      - name: Restore
        working-directory: buildsrc/SwordMastery
        run: dotnet restore SwordMastery.csproj

      - name: Build
        working-directory: buildsrc/SwordMastery
        run: dotnet build SwordMastery.csproj --configuration Release --no-restore

      - name: Validate translations and package
        shell: bash
        run: |
          set -euo pipefail
          cd buildsrc/SwordMastery
          python3 - <<'PY'
          import json
          from pathlib import Path
          keys = None
          for lang in ["default", "ko", "ja", "zh"]:
              data=json.loads((Path("i18n")/f"{lang}.json").read_text(encoding="utf-8"))
              assert isinstance(data,dict)
              if keys is None: keys=set(data)
              assert set(data)==keys, f"{lang}: different i18n keys"
          assert Path("bin/Release/net6.0/SwordMastery.dll").stat().st_size > 10000
          print("Translations and DLL validated:",len(keys),"keys")
          PY
          mkdir -p package/SwordMastery
          cp bin/Release/net6.0/SwordMastery.dll package/SwordMastery/
          cp manifest.json package/SwordMastery/
          cp -r assets i18n package/SwordMastery/
          cp README_USER.txt package/SwordMastery/
          echo "PATCH37 FIX01 - CJK display corrections; language verified by source validation; in-game testing required." > package/SwordMastery/PATCH37_FIX01_README.txt
          (cd package && zip -qr ../../../SwordMastery_PATCH_37_FIX01_INSTALL.zip SwordMastery)

      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwordMastery-PATCH37-FIX01-INSTALL
          path: SwordMastery_PATCH_37_FIX01_INSTALL.zip
          if-no-files-found: error
