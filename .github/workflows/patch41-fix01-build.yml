name: Sword Mastery PATCH41 FIX01 Apex 25 Percent Reserve
on:
  push:
    branches: [build/patch41-fix01-apex-25-percent]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract complete cumulative PATCH41 source
        run: unzip -q SwordMastery_PATCH_41_FIX01_TOWER_SCALING_PASSIVES_APEX25_SOURCE.zip -d src
      - name: Install Stardew SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
          force_build_with_dotnet_version: true
      - name: Restore
        run: dotnet restore src/SwordMastery/SwordMastery.csproj
      - name: Compile
        run: dotnet build src/SwordMastery/SwordMastery.csproj -c Release --no-restore
      - name: Package installable mod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/SwordMastery
          cp src/SwordMastery/bin/Release/net6.0/SwordMastery.dll out/SwordMastery/
          cp src/SwordMastery/manifest.json out/SwordMastery/
          cp -r src/SwordMastery/assets out/SwordMastery/
          cp -r src/SwordMastery/i18n out/SwordMastery/
          cp src/SwordMastery/README_USER.txt src/SwordMastery/README_PATCH_41.txt out/SwordMastery/
          (cd out && zip -qr ../SwordMastery_PATCH41_FIX01_APEX25_INSTALL.zip SwordMastery)
          unzip -t SwordMastery_PATCH41_FIX01_APEX25_INSTALL.zip
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SwordMastery_PATCH41_FIX01_APEX25_INSTALL
          path: SwordMastery_PATCH41_FIX01_APEX25_INSTALL.zip
          if-no-files-found: error
