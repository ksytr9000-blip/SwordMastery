name: SwordMastery PATCH43 installer
on:
  push:
    branches:
      - build/patch43-fix02-sewer-hook
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1
        with:
          dotnet_version: 6.0.x
          force_build_with_dotnet_version: true
      - name: Unpack PATCH41 cumulative source
        shell: bash
        run: |
          unzip -q SwordMastery_PATCH_41_FIX01_TOWER_SCALING_PASSIVES_APEX25_SOURCE.zip -d src
          test -f src/SwordMastery/SwordMastery.csproj
      - name: Apply PATCH42 fix
        working-directory: src
        run: python3 ../patch42_apply.py
      - name: Apply PATCH42 FIX01 GMCM controls
        working-directory: src
        run: python3 ../patch42_fix01.py
      - name: Apply PATCH43 statue link
        working-directory: src
        run: python3 ../patch43_statue.py
      - name: Apply PATCH43 FIX01 overload selection
        working-directory: src
        run: python3 ../patch43_fix01.py
      - name: Apply PATCH43 FIX02 statue action argument fix
        working-directory: src
        run: python3 ../patch43_fix02.py
      - name: Restore and compile
        working-directory: src/SwordMastery
        run: |
          dotnet restore SwordMastery.csproj
          dotnet build SwordMastery.csproj -c Release --no-restore
      - name: Create ready-to-install ZIP
        shell: bash
        run: |
          set -e
          mkdir -p package/SwordMastery
          cp src/SwordMastery/bin/Release/net6.0/SwordMastery.dll package/SwordMastery/
          cp src/SwordMastery/manifest.json package/SwordMastery/
          cp -r src/SwordMastery/i18n package/SwordMastery/
          cp -r src/SwordMastery/assets package/SwordMastery/
          cp src/SwordMastery/README_USER.txt package/SwordMastery/ || true
          cd package
          zip -qr ../SwordMastery_PATCH_43_FIX02_INSTALL.zip SwordMastery
      - uses: actions/upload-artifact@v4
        with:
          name: SwordMastery_PATCH_43_FIX02_INSTALL
          path: SwordMastery_PATCH_43_FIX02_INSTALL.zip
          if-no-files-found: error
